<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Hattrick Academy</title>
    <meta name="description" content="Thank you! Your payment to Hattrick Soccer Academy was successful.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#12136b',
                            800: '#1a1b8a',
                            700: '#242593',
                            600: '#2d2eab',
                            detail: '#00D4FF',
                            detailLight: '#66E8FF',
                        }
                    },
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'scale-up': 'scaleUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleUp: {
                            '0%': { opacity: '0', transform: 'scale(0.5)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #12136b; color: #f3f4f6; overflow: hidden; }
        .glass-card {
            background: linear-gradient(145deg, rgba(36,37,147,0.45) 0%, rgba(18,19,107,0.85) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.15);
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.4);
        }
        .text-gradient {
            background: linear-gradient(135deg, #00D4FF, #66E8FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-container {
            position: relative; border-radius: 50%; overflow: hidden;
            border: 2px solid rgba(0,212,255,0.7); box-shadow: 0 0 15px rgba(0,212,255,0.4);
            background: #fff; display: flex; align-items: center; justify-content: center;
        }
        .logo-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); }
        .btn-primary {
            background: linear-gradient(90deg, #242593, #00D4FF);
            box-shadow: 0 0 15px rgba(0,212,255,0.3);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(0,212,255,0.7); transform: translateY(-2px); }
    </style>
</head>
<body class="text-gray-300 font-sans antialiased min-h-screen flex flex-col justify-center items-center relative overflow-hidden px-4">

    <!-- Background -->
    <div class="absolute inset-0" style="background-image: url('https://images.unsplash.com/photo-1518605368461-1ee7e149f1db?ixlib=rb-4.0.3'); background-size: cover; background-position: center; opacity: 0.15;"></div>
    <div class="absolute inset-0" style="background: radial-gradient(circle at center, rgba(18,19,107,0.85) 0%, #12136b 100%);"></div>

    <!-- Animated Blobs -->
    <div class="absolute top-20 left-10 w-72 h-72 bg-brand-detail rounded-full mix-blend-multiply filter blur-[100px] opacity-20 animate-blob"></div>
    <div class="absolute bottom-20 right-10 w-72 h-72 bg-emerald-500 rounded-full mix-blend-multiply filter blur-[100px] opacity-15 animate-blob" style="animation-delay: 2s;"></div>

    <!-- Card -->
    <div class="relative z-10 w-full max-w-md p-8 md:p-10 glass-card rounded-3xl text-center animate-fade-in">
        
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="logo-container w-16 h-16">
                <img src="logo.png" alt="Hattrick Academy Logo">
            </div>
        </div>

        <!-- Success Animated Checkmark -->
        <div class="flex justify-center mb-6">
            <div class="w-20 h-20 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 rounded-full flex items-center justify-center animate-scale-up shadow-[0_0_30px_rgba(16,185,129,0.3)]">
                <i class="fa-solid fa-check text-4xl"></i>
            </div>
        </div>

        <h1 class="text-3xl font-black text-white mb-3" data-i18n="success_title">Payment Successful!</h1>
        <p class="text-sm font-light text-gray-300 leading-relaxed mb-6" data-i18n="success_desc">
            Thank you! Your payment has been received and processed successfully. Your program registration is now active.
        </p>

        <div class="bg-white/5 border border-white/10 rounded-2xl p-4 mb-8">
            <p class="text-xs text-gray-400 font-light flex items-center justify-center gap-2">
                <i class="fa-solid fa-spinner animate-spin text-brand-detail"></i>
                <span data-i18n="success_redirect">Redirecting back to dashboard in <span id="countdown">5</span> seconds...</span>
            </p>
        </div>

        <a href="dashboard.html" class="block w-full btn-primary text-white font-bold py-4 rounded-xl text-center uppercase tracking-wider text-sm" data-i18n="success_btn">
            Go to Dashboard Now
        </a>
    </div>

    <!-- JS & i18n -->
    <script>
        // Countdown redirect
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'dashboard.html';
            }
        }, 1000);
    </script>
    <script src="i18n.js"></script>
</body>
</html>
